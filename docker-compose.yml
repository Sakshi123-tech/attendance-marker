version: "3.9"

services:
  attendance-mongodb:
    image: mongo:7
    container_name: attendance-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    networks:
      - attendance-network

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  attendance-backend:
    build:
      context: ./backend
      target: development

    container_name: attendance-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    environment:
      MONGO_URI: mongodb://attendance-mongodb:27017/attendance
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      attendance-mongodb:
        condition: service_healthy

    networks:
      - attendance-network

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  attendance-frontend:
    build:
      context: ./frontend

    container_name: attendance-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    env_file:
      - ./frontend/.env

    environment:
      VITE_API_BASE_URL: http://localhost:5000/api/v1
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    depends_on:
      attendance-backend:
        condition: service_started

    networks:
      - attendance-network

networks:
  attendance-network:
    driver: bridge

volumes:
  mongo-data: